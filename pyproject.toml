[project]
name = "csv-analyzer"
version = "2.0.0"
description = "Universal Database Analyzer - A DBeaver-like database client with data analysis"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=0.9",
    "polars>=0.20",
    "sqlalchemy>=2.0",
    "chardet>=5.0",
    "numpy>=1.24",
    "pymysql>=1.1.2",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
mysql = ["pymysql>=1.1"]
all = ["psycopg2-binary>=2.9", "pymysql>=1.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
db-analyzer = "csv_analyzer.backend.server:main"
